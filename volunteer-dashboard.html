<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Volunteer Dashboard | PawRescue</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f7fa;
    color: #333;
}

header {
    height: 70px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.logo {
    color: #f97316;
    font-size: 25px;
    font-weight: bold;
}

nav {
    display: flex;
    gap: 20px;
}

nav a {
    text-decoration: none;
    color: #444;
}

nav a:hover {
    color: #f97316;
}

.container {
    width: 92%;
    max-width: 1200px;
    margin: 35px auto;
}

.welcome {
    margin-bottom: 25px;
}

.welcome h1 {
    margin-bottom: 7px;
}

.welcome p {
    color: #777;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.stat {
    background: white;
    padding: 22px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,.06);
}

.stat-icon {
    font-size: 30px;
    margin-bottom: 10px;
}

.stat-number {
    font-size: 28px;
    font-weight: bold;
    color: #f97316;
}

.stat-label {
    color: #777;
    margin-top: 5px;
}

/* SECTIONS */

.section {
    margin-bottom: 30px;
}

.section-title {
    margin-bottom: 15px;
}

.section-title span {
    color: #f97316;
}

/* CASES */

.cases {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 20px;
}

.case {
    background: white;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 5px 18px rgba(0,0,0,.07);
}

.case-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.case-id {
    font-weight: bold;
    color: #555;
}

.badge {
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.emergency {
    background: #fee2e2;
    color: #b91c1c;
}

.normal {
    background: #fef3c7;
    color: #92400e;
}

.case h3 {
    margin-bottom: 10px;
}

.case-info {
    color: #666;
    line-height: 1.8;
    font-size: 14px;
}

.location {
    background: #f8fafc;
    padding: 10px;
    margin-top: 12px;
    border-radius: 8px;
    font-size: 13px;
}

.actions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.btn {
    flex: 1;
    border: none;
    padding: 10px;
    border-radius: 7px;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
}

.accept {
    background: #16a34a;
    color: white;
}

.map {
    background: #dbeafe;
    color: #1d4ed8;
}

.complete {
    background: #f97316;
    color: white;
}

/* ACTIVE CASE */

.active-case {
    background: #fff7ed;
    border: 2px solid #fed7aa;
    border-radius: 14px;
    padding: 25px;
    margin-bottom: 30px;
}

.active-case h2 {
    color: #ea580c;
    margin-bottom: 10px;
}

.timeline {
    display: flex;
    justify-content: space-between;
    margin: 25px 0;
    position: relative;
}

.timeline::before {
    content: "";
    position: absolute;
    top: 17px;
    left: 5%;
    right: 5%;
    height: 3px;
    background: #ddd;
    z-index: 0;
}

.step {
    text-align: center;
    position: relative;
    z-index: 1;
}

.circle {
    width: 35px;
    height: 35px;
    border-radius: 50%;
    background: #ddd;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: auto auto 8px;
    color: white;
    font-weight: bold;
}

.step.active .circle {
    background: #f97316;
}

.step.completed .circle {
    background: #16a34a;
}

.step p {
    font-size: 12px;
}

/* EMPTY */

.empty {
    background: white;
    padding: 40px;
    border-radius: 12px;
    text-align: center;
    color: #777;
}

@media(max-width:900px) {

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .cases {
        grid-template-columns: 1fr 1fr;
    }

}

@media(max-width:600px) {

    header {
        padding: 0 20px;
    }

    nav {
        display: none;
    }

    .stats,
    .cases {
        grid-template-columns: 1fr;
    }

    .timeline {
        overflow-x: auto;
        gap: 30px;
    }

}

</style>

</head>

<body>

<header>

<div class="logo">
🐾 PawRescue
</div>

<nav>

<a href="dashboard.html">
Home
</a>

<a href="map.html">
Map
</a>

<a href="emergency-sos.html">
Emergency
</a>

<a href="profile.html">
Profile
</a>

</nav>

</header>

<div class="container">

<div class="welcome">

<h1>
👋 Welcome, Volunteer
</h1>

<p>
Help animals in your community.
</p>

</div>

<!-- STATS -->

<div class="stats">

<div class="stat">

<div class="stat-icon">
🚨
</div>

<div
id="availableCount"
class="stat-number">
0
</div>

<div class="stat-label">
Available Cases
</div>

</div>

<div class="stat">

<div class="stat-icon">
🚗
</div>

<div
id="activeCount"
class="stat-number">
0
</div>

<div class="stat-label">
My Active Rescue
</div>

</div>

<div class="stat">

<div class="stat-icon">
❤️
</div>

<div
id="completedCount"
class="stat-number">
0
</div>

<div class="stat-label">
Completed
</div>

</div>

<div class="stat">

<div class="stat-icon">
🏆
</div>

<div
id="points"
class="stat-number">
0
</div>

<div class="stat-label">
Rescue Points
</div>

</div>

</div>

<!-- ACTIVE CASE -->

<div
id="activeSection"
class="section"
style="display:none;">

<h2 class="section-title">
🚑 <span>My Active Rescue</span>
</h2>

<div
id="activeCase"
class="active-case">
</div>

</div>

<!-- AVAILABLE CASES -->

<div class="section">

<h2 class="section-title">
🚨 <span>Available Rescue Cases</span>
</h2>

<div
id="cases"
class="cases">
</div>

<div
id="empty"
class="empty"
style="display:none;">

<h2>
🐾 No Active Cases
</h2>

<p>
There are currently no rescue requests available.
</p>

</div>

</div>

</div>

<script>


/*
    DEMO USER
*/

const volunteer =
    JSON.parse(
        localStorage.getItem(
            "volunteerUser"
        )
    ) || {

        name:
            "Volunteer",

        phone:
            ""

    };


/*
    LOAD SOS CASES
*/

let cases =
    JSON.parse(
        localStorage.getItem(
            "sosCases"
        )
    ) || [];


/*
    LOAD RESCUE CASES
*/

let rescueCases =
    JSON.parse(
        localStorage.getItem(
            "rescueCases"
        )
    ) || [];


/*
    COMBINE CASES
*/

let allCases = [
    ...cases,
    ...rescueCases
];


/*
    DISPLAY CASES
*/

function displayCases() {


    const container =
        document.getElementById(
            "cases"
        );


    const empty =
        document.getElementById(
            "empty"
        );


    container.innerHTML = "";


    const available =
        allCases.filter(
            function(item) {

                return (
                    !item.volunteerId &&
                    (
                        item.status ===
                        "Waiting for volunteer"
                        ||
                        item.status ===
                        "Pending"
                        ||
                        !item.status
                    )
                );

            }
        );


    document.getElementById(
        "availableCount"
    ).textContent =
        available.length;


    if (available.length === 0) {

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    available.forEach(
        function(item) {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "case";


            const isEmergency =
                item.id &&
                item.id.startsWith(
                    "SOS-"
                );


            const emergencyClass =
                isEmergency
                    ? "emergency"
                    : "normal";


            const emergencyText =
                isEmergency
                    ? "EMERGENCY"
                    : "RESCUE";


            const latitude =
                item.latitude ||
                "";


            const longitude =
                item.longitude ||
                "";


            let mapUrl =
                "#";


            if (
                latitude &&
                longitude
            ) {

                mapUrl =
                    `https://www.google.com/maps/search/?api=1&query=${latitude},${longitude}`;

            }


            card.innerHTML = `

                <div class="case-header">

                    <span class="case-id">
                        ${item.id || "RESCUE"}
                    </span>

                    <span class="badge ${emergencyClass}">
                        ${emergencyText}
                    </span>

                </div>


                <h3>

                    ${
                        item.emergencyType ||
                        item.animalType ||
                        "Animal Rescue"
                    }

                </h3>


                <div class="case-info">

                    🐾 Animal:
                    ${
                        item.animalType ||
                        "Unknown"
                    }

                    <br>

                    🔢 Animals:
                    ${
                        item.animalCount ||
                        "1"
                    }

                    <br>

                    👤 Reporter:
                    ${
                        item.reporterName ||
                        "Unknown"
                    }

                    <br>

                    📞 Phone:
                    ${
                        item.reporterPhone ||
                        "Not available"
                    }

                </div>


                <div class="location">

                    📍
                    ${
                        item.locationDescription ||
                        "Location available on map"
                    }

                </div>


                <div class="actions">

                    <a
                        href="${mapUrl}"
                        target="_blank"
                        class="btn map">

                        🗺️ Map

                    </a>


                    <button
                        class="btn accept"
                        onclick="acceptCase('${item.id}')">

                        ✓ Accept

                    </button>

                </div>

            `;


            container.appendChild(
                card
            );

        }
    );

}


/*
    ACCEPT CASE
*/

function acceptCase(
    caseId
) {


    const volunteerId =
        "VOL-" +
        Date.now()
            .toString()
            .slice(-6);


    let found = false;


    allCases =
        allCases.map(
            function(item) {


                if (
                    item.id === caseId
                ) {

                    found = true;


                    item.volunteerId =
                        volunteerId;


                    item.volunteerName =
                        volunteer.name;


                    item.volunteerPhone =
                        volunteer.phone;


                    item.status =
                        "Accepted";


                    item.acceptedAt =
                        new Date()
                            .toLocaleString();

                }


                return item;

            }
        );


    if (!found) {

        alert(
            "Case not found."
        );

        return;

    }


    /*
        SAVE BOTH STORAGE TYPES
    */

    const updatedSOS =
        allCases.filter(
            item =>
                item.id &&
                item.id.startsWith(
                    "SOS-"
                )
        );


    const updatedRescue =
        allCases.filter(
            item =>
                !item.id ||
                !item.id.startsWith(
                    "SOS-"
                )
        );


    localStorage.setItem(
        "sosCases",
        JSON.stringify(
            updatedSOS
        )
    );


    localStorage.setItem(
        "rescueCases",
        JSON.stringify(
            updatedRescue
        )
    );


    alert(
        "✅ Rescue case accepted!"
    );


    displayCases();

    displayActiveCase();

}


/*
    ACTIVE CASE
*/

function displayActiveCase() {


    const active =
        allCases.find(
            function(item) {

                return (
                    item.volunteerId &&
                    item.volunteerName ===
                    volunteer.name &&
                    item.status !==
                    "Completed"
                );

            }
        );


    const section =
        document.getElementById(
            "activeSection"
        );


    const box =
        document.getElementById(
            "activeCase"
        );


    if (!active) {

        section.style.display =
            "none";

        document.getElementById(
            "activeCount"
        ).textContent =
            "0";

        return;

    }


    section.style.display =
        "block";


    document.getElementById(
        "activeCount"
    ).textContent =
        "1";


    const steps = [

        "Accepted",
        "On the Way",
        "Arrived",
        "Rescued"

    ];


    const currentIndex =
        steps.indexOf(
            active.status
        );


    box.innerHTML = `

        <h2>
            🚑 Case ${active.id}
        </h2>


        <p>
            ${
                active.emergencyType ||
                "Animal Rescue"
            }
        </p>


        <div class="timeline">

            ${steps.map(
                function(step,index) {

                    let className = "";

                    if (
                        index <
                        currentIndex
                    ) {

                        className =
                            "completed";

                    }

                    else if (
                        index ===
                        currentIndex
                    ) {

                        className =
                            "active";

                    }


                    return `

                        <div class="step ${className}">

                            <div class="circle">

                                ${
                                    index <
                                    currentIndex
                                        ? "✓"
                                        : index + 1
                                }

                            </div>

                            <p>
                                ${step}
                            </p>

                        </div>

                    `;

                }
            ).join("")}

        </div>


        <div class="actions">

            <button
                class="btn map"
                onclick="openCaseMap('${active.latitude}','${active.longitude}')">

                🗺️ Open Map

            </button>


            <button
                class="btn accept"
                onclick="updateStatus('${active.id}')">

                Update Status

            </button>

        </div>

    `;

}


/*
    UPDATE STATUS
*/

function updateStatus(
    caseId
) {


    const caseItem =
        allCases.find(
            item =>
                item.id === caseId
        );


    if (!caseItem) {

        return;

    }


    const statuses = [

        "Accepted",
        "On the Way",
        "Arrived",
        "Rescued",
        "Completed"

    ];


    const current =
        statuses.indexOf(
            caseItem.status
        );


    const next =
        current + 1;


    if (
        next >=
        statuses.length
    ) {

        return;

    }


    caseItem.status =
        statuses[next];


    if (
        caseItem.status ===
        "Completed"
    ) {

        caseItem.completedAt =
            new Date()
                .toLocaleString();

        caseItem.points =
            50;

    }


    saveCases();


    displayCases();

    displayActiveCase();

    updateStats();

}


/*
    MAP
*/

function openCaseMap(
    lat,
    lng
) {


    if (!lat || !lng) {

        alert(
            "Location is not available."
        );

        return;

    }


    window.open(

        `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`,

        "_blank"

    );

}


/*
    SAVE
*/

function saveCases() {


    const updatedSOS =
        allCases.filter(
            item =>
                item.id &&
                item.id.startsWith(
                    "SOS-"
                )
        );


    const updatedRescue =
        allCases.filter(
            item =>
                !item.id ||
                !item.id.startsWith(
                    "SOS-"
                )
        );


    localStorage.setItem(
        "sosCases",
        JSON.stringify(
            updatedSOS
        )
    );


    localStorage.setItem(
        "rescueCases",
        JSON.stringify(
            updatedRescue
        )
    );

}


/*
    STATS
*/

function updateStats() {


    const completed =
        allCases.filter(
            item =>
                item.volunteerName ===
                volunteer.name &&
                item.status ===
                "Completed"
        );


    document.getElementById(
        "completedCount"
    ).textContent =
        completed.length;


    document.getElementById(
        "points"
    ).textContent =
        completed.length * 50;

}


/*
    INITIAL LOAD
*/

displayCases();

displayActiveCase();

updateStats();


</script>

</body>

</html>
